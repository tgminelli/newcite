<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noble Bloom • Премиум сиропы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap');
        
        :root { --gold: #d4af77; }
        
        * { transition: all 0.3s ease; }
        
        .hero-bg {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('https://raw.githubusercontent.com/твой_юзернейм/твой_репозиторий/main/твоё_основное_фото.jpg') center/cover no-repeat;
        }
        
        .flavor-card:hover { transform: translateY(-12px); box-shadow: 0 25px 50px -12px rgb(212 175 119 / 0.3); }
    </style>
</head>
<body class="bg-[#f9f5f0] text-gray-900">

    <!-- NAVBAR (логотип из твоего файла) -->
    <nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b">
        <div class="max-w-screen-2xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="https://raw.githubusercontent.com/твой_юзернейм/твой_репозиторий/main/Logo%20Noble%20Bloom%20conv%201%20—%20копия.jpg" 
                     alt="Noble Bloom Logo" class="h-10 w-auto">
                <h1 class="text-3xl font-bold tracking-tighter" style="font-family: 'Playfair Display', serif;">Noble Bloom</h1>
            </div>
            <!-- меню осталось то же -->
            <div class="hidden md:flex gap-10 text-lg">
                <a href="#flavors" class="hover:text-[#d4af77]">Вкусы</a>
                <a href="#about" class="hover:text-[#d4af77]">О бренде</a>
                <a href="#howto" class="hover:text-[#d4af77]">Как использовать</a>
            </div>
            <a href="https://ozon.ru" target="_blank" class="px-8 py-4 bg-[#d4af77] text-white rounded-3xl font-semibold">
                Купить
            </a>
        </div>
    </nav>

    <!-- HERO — замени ссылку на своё основное фото -->
    <header class="hero-bg h-screen flex items-center text-white">
        <div class="max-w-screen-2xl mx-auto px-8">
            <h1 class="text-6xl md:text-7xl font-bold leading-none">Благородный вкус<br>в каждой капле</h1>
            <!-- остальной текст hero без изменений -->
        </div>
    </header>

    <!-- FLAVORS SECTION -->
    <section id="flavors" class="max-w-screen-2xl mx-auto px-8 py-20">
        <h2 class="text-5xl text-center mb-12">Наши вкусы</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-8">

            <!-- Соленая карамель -->
            <div class="flavor-card bg-white rounded-3xl overflow-hidden shadow">
                <div class="h-64 bg-amber-100 flex items-center justify-center">
                    <img src="https://raw.githubusercontent.com/твой_юзернейм/твой_репозиторий/main/caramel.jpg" 
                         alt="Соленая карамель" class="h-full w-auto object-contain">
                </div>
                <div class="p-6">
                    <h3 class="text-2xl font-semibold">Соленая карамель</h3>
                    <button class="mt-4 w-full py-4 bg-gray-900 text-white rounded-2xl">В корзину</button>
                </div>
            </div>

            <!-- Клубника -->
            <div class="flavor-card bg-white rounded-3xl overflow-hidden shadow">
                <div class="h-64 bg-pink-100 flex items-center justify-center">
                    <img src="https://raw.githubusercontent.com/твой_юзернейм/твой_репозиторий/main/strawberry.jpg" 
                         alt="Клубника" class="h-full w-auto object-contain">
                </div>
                <div class="p-6">
                    <h3 class="text-2xl font-semibold">Клубника</h3>
                    <button class="mt-4 w-full py-4 bg-gray-900 text-white rounded-2xl">В корзину</button>
                </div>
            </div>

            <!-- Малина -->
            <div class="flavor-card bg-white rounded-3xl overflow-hidden shadow">
                <div class="h-64 bg-red-100 flex items-center justify-center">
                    <img src="https://raw.githubusercontent.com/твой_юзернейм/твой_репозиторий/main/raspberry.jpg" 
                         alt="Малина" class="h-full w-auto object-contain">
                </div>
                <div class="p-6">
                    <h3 class="text-2xl font-semibold">Малина</h3>
                    <button class="mt-4 w-full py-4 bg-gray-900 text-white rounded-2xl">В корзину</button>
                </div>
            </div>

            <!-- Мадагаскарская ваниль (пока заглушка) -->
            <div class="flavor-card bg-white rounded-3xl overflow-hidden shadow">
                <div class="h-64 bg-yellow-100 flex items-center justify-center text-6xl">🌿</div>
                <div class="p-6">
                    <h3 class="text-2xl font-semibold">Мадагаскарская ваниль</h3>
                    <p class="text-sm text-gray-500">Загрузи фото → замени ссылку</p>
                </div>
            </div>

            <!-- Лесной орех (пока заглушка) -->
            <div class="flavor-card bg-white rounded-3xl overflow-hidden shadow">
                <div class="h-64 bg-amber-200 flex items-center justify-center text-6xl">🥜</div>
                <div class="p-6">
                    <h3 class="text-2xl font-semibold">Лесной орех</h3>
                    <p class="text-sm text-gray-500">Загрузи фото → замени ссылку</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Остальные секции оставил без изменений (можно потом доработать) -->

</body>
</html>
